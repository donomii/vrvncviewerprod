plugins {
    id "com.android.application"
}

android {
    namespace "com.praeceptamachinae.vrvncviewer"
    compileSdk 35

    defaultConfig {
        applicationId "com.praeceptamachinae.vrvncviewer"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
